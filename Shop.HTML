<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TutoBlox Shop</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            overflow: hidden; /* Чтобы не было прокрутки от фона */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Холст для матричного дождя */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Отправляем на задний план */
            opacity: 0.3; /* Делаем полупрозрачным, чтобы не мешал тексту */
        }

        /* Основной контент (поверх фона) */
        .content {
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 5em;
            font-weight: bold;
            border: 5px solid #fff;
            display: inline-block;
            padding: 20px;
            border-radius: 50%;
            margin-bottom: 20px;
            background-color: rgba(0, 0, 0, 0.8); /* Темная подложка под логотипом */
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 3em;
            margin: 10px 0;
            text-shadow: 0 0 10px #fff;
        }

        p {
            font-size: 1.2em;
            color: #ccc;
            max-width: 600px;
            margin: 0 auto 30px;
            background-color: rgba(0, 0, 0, 0.7); /* Читаемость текста на фоне */
            padding: 10px;
            border-radius: 5px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #aaa;
            box-shadow: 0 0 15px #fff;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8em;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- Фон с эффектом матрицы -->
    <canvas id="matrix-bg"></canvas>

    <!-- Твой контент -->
    <div class="content">
        <div class="logo">T</div>
        <h1>TutoBlox Shop</h1>
        <p>С любовью к каждому покупателю. Оригинальные фигурки Roblox, кастомные детали и эксклюзивные лоты.</p>
        
        <!-- Замени ссылку на свой профиль Авито! -->
        <a href="https://www.avito.ru" class="btn" target="_blank">Перейти на Авито</a>

        <div class="footer">
            &copy; 2026 TutoBlox. Все права защищены.
        </div>
    </div>

    <!-- Скрипт для матричного дождя -->
    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0F0"; // Зеленый цвет
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 50); // Скорость анимации

        // Обновление размера при изменении окна
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
